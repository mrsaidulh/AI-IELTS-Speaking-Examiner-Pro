version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ielts_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ielts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-ielts_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ielts_user} -d ${POSTGRES_DB:-ielts_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ielts_ollama
    restart: always
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11434:11434"

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: ielts_kokoro
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8880:8880"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ielts_backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 120
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ielts_user}:${POSTGRES_PASSWORD:-SecurePassword123!}@postgres:5432/${POSTGRES_DB:-ielts_production}
      - OLLAMA_HOST=http://ollama:11434
      - KOKORO_HOST=http://kokoro:8880
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      kokoro:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ielts_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_models:
